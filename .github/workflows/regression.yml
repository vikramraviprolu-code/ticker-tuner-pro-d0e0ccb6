name: Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily dependency advisory sweep (06:00 UTC) catches newly-disclosed
    # advisories against unchanged dependencies. Reports; does not block.
    - cron: "0 6 * * *"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Hard gate on things a commit can actually get wrong: missing auth
  # middleware on paid-API server functions and committed secrets.
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Auth-middleware + secret scan (hard gate)
        run: node scripts/security-check.mjs
      - name: Gitleaks secret scan (SARIF)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

  # Dependency advisories are external events, not regressions in this repo:
  # a CVE published overnight against an unchanged lockfile must not turn the
  # whole pipeline red. So this job always reports (Code Scanning + job summary
  # + a single rolling tracking issue) and only fails the build on a CRITICAL
  # advisory that has a fix available.
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to Code Scanning
      issues: write # rolling tracking issue for non-critical advisories
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy vulnerability scan (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
      - name: Summarise advisories
        id: summary
        run: node scripts/summarise-advisories.mjs trivy.json
      - name: Track advisories in a rolling issue
        if: >-
          github.event_name == 'schedule' || github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        env:
          ADVISORY_BODY: ${{ steps.summary.outputs.body }}
          ADVISORY_COUNT: ${{ steps.summary.outputs.critical }}${{ steps.summary.outputs.high }}
        with:
          script: |
            const title = "Dependency advisories: fixes available";
            const clean = process.env.ADVISORY_COUNT === "00";
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "dependencies,security",
            });
            const issue = open.data.find((i) => i.title === title);
            if (clean) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: "Lockfile is clean of fixable CRITICAL/HIGH advisories — closing.",
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: "closed",
                });
              }
              return;
            }
            const body = process.env.ADVISORY_BODY;
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["dependencies", "security"],
              });
            }
      - name: Fail on CRITICAL advisories with a fix
        if: steps.summary.outputs.critical != '0'
        run: |
          echo "::error::${{ steps.summary.outputs.critical }} CRITICAL advisory/advisories with a published fix — see the job summary."
          exit 1

  docs:
    name: Docs consistency (pre-publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # PRD lives outside the repo (/mnt/documents). Skip PRD-specific checks
      # in CI by unsetting the docs dir; version.ts/README/CHANGELOG/glossary
      # are still validated and that's what we want to gate PRs on.
      - name: Pre-publish checklist (repo-only)
        run: npm run pre-publish
        env:
          SKIP_PRD_CHECK: "1"

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run Playwright (auto-starts preview)
        run: npm run test:e2e
        env:
          CI: "1"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
